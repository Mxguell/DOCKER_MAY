
name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_MXGUELL }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push
        uses: docker/build-push-action@v6
        with:
          context: ./13-11-2026_TAREA MODULO 6/repo_actividad-a64
          push: true
          tags: |
            mxguell/a64:latest
            mxguell/a64:build-${{ github.run_number }}
